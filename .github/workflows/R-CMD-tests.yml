name: R Package Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: "4.5" }
          - { os: ubuntu-latest, r: "4.4" }
          # - { os: macos-latest,  r: "4.5" }   # 可按需打开
          # - { os: windows-latest, r: "4.5" }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RSPM: https://packagemanager.posit.co/cran/__linux__/jammy/latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff5-dev libjpeg-dev libcairo2-dev \
            fonts-noto-cjk

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::testthat
            any::devtools
            any::dplyr
            any::tidyr
            any::ggplot2
            any::scales
            any::purrr
            any::tibble
            any::forcats
            any::stringr
            any::readr
            any::readxl
            any::countrycode
            any::patchwork
            any::ggridges
            any::ggrepel
            any::lintr
          needs: |
            check

      - name: Run tests
        run: |
          Rscript -e 'options(crayon.enabled = TRUE); testthat::test_dir("自动测试/testthat", reporter = c("summary", "fail"))'

      - name: Syntax check
        run: |
          Rscript 开发脚本/语法检查.R

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-figs-${{ matrix.config.os }}-r${{ matrix.config.r }}
          path: 分析输出/图表/smoke_*.png
          if-no-files-found: ignore
