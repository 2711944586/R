      - generic [ref=e690]:
        - generic [ref=e691]:
          - paragraph [ref=e692]: 研究问题：跨国人均卫生支出的不平等如何演化？
          - paragraph [ref=e693]: 方法：对每年的人均 CHE（USD 2023）序列计算三个互补的不平等指标：Gini、Theil-T、Atkinson(ε)，全部使用人口加权。
        - figure "04_metrics.R · 三个不平等指数的实现" [ref=e694]:
          - generic [ref=e695]: 04_metrics.R · 三个不平等指数的实现
          - code [ref=e697]: "gini_weighted <- function(x, w = NULL) { if (is.null(w)) w <- rep(1, length(x)) ok <- is.finite(x) & is.finite(w) & x >= 0 & w > 0 x <- x[ok]; w <- w[ok] if (length(x) < 2) return(NA_real_) ord <- order(x) x <- x[ord]; w <- w[ord] cum_w <- cumsum(w) cum_xw <- cumsum(x * w) total_w <- sum(w); total_xw <- sum(x * w) if (total_xw == 0) return(0) g <- 1 - 2 * sum((cum_xw - x * w / 2) * w) / (total_w * total_xw) g } #' Theil-T 指数（人口加权） theil_t <- function(x, w = NULL) { if (is.null(w)) w <- rep(1, length(x)) ok <- is.finite(x) & is.finite(w) & x > 0 & w > 0 x <- x[ok]; w <- w[ok] if (length(x) < 2) return(NA_real_) mean_x <- stats::weighted.mean(x, w) if (mean_x == 0) return(0) sum(w * x / sum(w * x) * log(x / mean_x)) } #' Atkinson 指数 (ε) atkinson <- function(x, w = NULL, eps = 0.5) { if (is.null(w)) w <- rep(1, length(x)) ok <- is.finite(x) & is.finite(w) & x > 0 & w > 0 x <- x[ok]; w <- w[ok] if (length(x) < 2) return(NA_real_) mean_x <- stats::weighted.mean(x, w) if (eps == 1) { ede <- exp(stats::weighted.mean(log(x), w)) } else { ede <- (stats::weighted.mean(x^(1 - eps), w))^(1 / (1 - eps)) } 1 - ede / mean_x } # ---- 2. 时间序列的不平等 --------------------------------------------------- #' 按 year 计算全球人均 CHE 的不平等指数面板 inequality_by_year <- function(master, value_col = \"che_pc_usd2023\", weight_col = \"pop\") { ensure_pkgs(c(\"dplyr\", \"tidyr\", \"tibble\")) val <- rlang::sym(value_col) wgt <- rlang::sym(weight_col) master |> dplyr::filter( is.finite(!!val), !!val > 0, is.finite(!!wgt) | TRUE ) |> dplyr::group_by(.data$year) |> dplyr::summarise( n = dplyr::n(), gini_eq = gini_weighted(!!val, NULL), gini_pop = if (weight_col %in% names(master)) { gini_weighted(!!val, !!wgt) } else NA_real_, theil_pop = if (weight_col %in% names(master)) { theil_t(!!val, !!wgt) } else NA_real_, atk05 = atkinson(!!val, NULL, eps = 0.5), atk1 = atkinson(!!val, NULL, eps = 1), mean_val = mean(!!val, na.rm = TRUE), median_val = median(!!val, na.rm = TRUE), .groups = \"drop\" ) }"
