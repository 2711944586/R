            - paragraph [ref=e2331]: 背景：2022 年是过去四十年来全球通胀最严重的年份之一。全球平均 CPI 同比上涨 8.7%（IMF WEO），其中央东、中亚、拉美多国超 20%。卫生服务价格通常与综合 CPI 同步或略高（劳动密集行业特征），因此 CPI 平减是合理的下约估计。
            - paragraph [ref=e2332]: 核心发现：180 个有数据的国家中，81 个（45%）在 2022 年实际人均 CHE 下降，尽管其名义值均在上升。这意味着这些国家的卫生购买力在绞缩，尽管戯码体量上增加了。寻找最典型的案例：土耳其（CPI +72%，名义 CHE +85%，实际 CHE -8%）、阿根廷（CPI +72%，名义 +66%，实际 -3.5%）。
            - paragraph [ref=e2333]: 收入组差异：低收入国家受冲击比例显著更高：LIC 中 62% 的国家实际 CHE 下降，UMIC 为 38%，HIC 为 29%。原因在于 LIC 的财政空间本就薄弱，价格上涨后几乎无法等比例增加实际预算，只能被动“吹展名义”。
            - paragraph [ref=e2334]: 政策含义：仅用名义增长监控卫生资金会造成“虚假进步”假象。任何 KPI、目标跟踪或政策评估都应强制使用实际值。在财政收缩与通胀共存时（如 2022–– 2023 的加纳、埃及、巴基斯坦），卫生系统面临双重压缩：实际资源减少 + 需求因生活费负担而上升。
