          - generic [ref=e915]:
            - paragraph [ref=e916]: 政府托底型：多数 OECD 国家 CHE 抬升、GGHED 上升，OOPS 反而下降。这些国家通过大规模财政转移支付和紧急卫生拨款吸收了危机成本，体现了制度韧性。
            - paragraph [ref=e917]: 财政紧缩型：部分中低收入国家 CHE 名义抬升但 OOPS 同步上升，意味着抬升主要来自居民自付。这类国家缺乏足够的财政缓冲空间，危机成本直接下沉到居民层面。
            - paragraph [ref=e918]: 跨国差异：美国、英国、澳大利亚在 2020–2022 年 GGHED 占 CHE 上升 2–4 个百分点，而印度、菲律宾等国家 OOPS 反而上升 2–6 个百分点，形成鲜明对比。
            - paragraph [ref=e919]: 政策含义：在常态预算外预设反周期卫生缓冲是关键；大流行准备基金、弹性筹资机制和快速调配网络是提升卫生体系韧性的三大支柱。
