          - generic [ref=e958]: 05_models.R · β-收敛回归
          - code [ref=e960]: "#' log(人均 CHE) 增速 ~ log(起始水平) + 固定效应 #' 输入：master 宽表（含 iso3_code, year, che_pc_usd2023, continent） fit_beta_convergence <- function(master, start_year = 2000, end_year = 2023) { ensure_pkgs(c(\"dplyr\")) if (!requireNamespace(\"fixest\", quietly = TRUE)) { warning(\"fixest not installed; beta-convergence skipped\") return(NULL) } panel <- master |> dplyr::filter(.data$year %in% c(start_year, end_year), is.finite(.data$che_pc_usd2023), .data$che_pc_usd2023 > 0) |> dplyr::select(\"iso3_code\", \"continent\", \"year\", \"che_pc_usd2023\") |> tidyr::pivot_wider(names_from = \"year\", values_from = \"che_pc_usd2023\", names_prefix = \"y_\") |> tidyr::drop_na() |> dplyr::mutate( log_start = log(!!rlang::sym(paste0(\"y_\", start_year))), log_end = log(!!rlang::sym(paste0(\"y_\", end_year))), growth = (.data$log_end - .data$log_start) / (end_year - start_year) ) if (nrow(panel) < 10) return(NULL) mod <- tryCatch( fixest::feols(growth ~ log_start | continent, data = panel), error = function(e) lm(growth ~ log_start + continent, data = panel) ) list( panel = panel, model = mod, beta = stats::coef(mod)[[\"log_start\"]], half_life = if (\"log_start\" %in% names(stats::coef(mod))) { -log(2) / stats::coef(mod)[[\"log_start\"]] } else NA_real_ ) }"
