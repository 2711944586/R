        - complementary [ref=e457]:
          - strong [ref=e458]: 分析解读
          - generic [ref=e459]:
            - paragraph [ref=e460]: 总量层面：全球卫生支出总量由 2000 年的 $4.68T 增长至 2023 年的 $10.56T，年化复合增率 3.60%。这意味着 23 年间全球卫生总投入累计翻了一倍多。人均 CHE 由 $780 升至 $1,328，但这一平均数掩盖了巨大的跨国差异——高收入国家人均超 $5,000，低收入国家仅 $30–50。
            - paragraph [ref=e461]: 结构层面：政府强制筹资（GGHE-D）份额在多数高收入国家保持上升，全球加权均值约 60%；私人筹资（PVT-D）在中等收入国家仍占 35–40%；外援（EXT）份额持续下降，但向最贫困国家集中，部分国家 EXT 占 CHE 超过 30%。
            - paragraph [ref=e462]: 动态层面：2008–2010 全球金融危机期间，多数国家卫生支出增速放缓但绝对值未下降（“卫生支出刚性”）；2020–2022 COVID-19 期间，各国紧急追加财政拨款，总量曲线出现明显凸起。两次冲击的影响在 F4 中单独拆解。
            - paragraph [ref=e463]: 收入组差异：高收入国家 23 年间人均 CHE 增速约 2.5%/年，中等收入国家约 5–8%/年（中国、印度、越南贡献大部分增量），低收入国家仅 1–2%/年。这种分化是否足以实现“收敛”，在 F5 中以 β-收敛模型正式检验。
