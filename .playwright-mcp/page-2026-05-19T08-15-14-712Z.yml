        - heading "四个代表性国家档案" [level=2] [ref=e3654]
        - paragraph [ref=e3655]: 以中 · 美 · 印 · 巴为例，呈现不同 archetype 在趋势、筹资结构、财务保护与外部依赖上的差异。
      - complementary [ref=e3656]:
        - strong [ref=e3657]: 本节解读
        - paragraph [ref=e3658]: 本节承接 F1-F14 的总体发现，把宏观趋势落到中、美、印、巴四个具有代表性的国家路径上。四国分别对应不同筹资结构和制度约束：美国是高投入但财务保护争议较大的高成本体系，中国体现公共筹资和人均支出的快速追赶，印度代表低中收入大国在 OOPS 压力下的扩面难题，巴西则展示公共卫生体系和基层网络对公平性的支撑。
        - paragraph [ref=e3659]: 读这一节时不要把四国当作排名，而应把它们当作四种 archetype 的剖面：看人均 CHE 的增长速度，也要同步看 GGHED、OOPS、EXT 和人口规模。只有把趋势图、筹资结构和面板表合在一起，才能解释同样的支出增长为什么会导向不同的家庭负担和健康产出。
