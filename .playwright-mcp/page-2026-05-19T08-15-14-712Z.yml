          - generic [ref=e1258]:
            - paragraph [ref=e1259]: 趋势延续：四国均维持上升趋势，中、印相对增速最大。中国预测 2028 年人均 CHE 将接近 1500 USD，印度则可能突破 200 USD 门槛。
            - paragraph [ref=e1260]: 不确定性带：外推 5 年后区间快速发散，其中非洲、南亚国家的置信区间宽度可达 30% 以上，反映历史序列的高波动性。
            - paragraph [ref=e1261]: 结构性断点：COVID-19 对所有模型都是外部结构性断点，auto.arima 会把它解释为方差上升而非均值转移，这意味着任何预测都应附带“下一个冲击会改写”的保留。
            - paragraph [ref=e1262]: 建议：结合 Shiny 仪表盘 Scenarios 模块做情景推演，将 ARIMA 与情景假设（如 GDP 冲击、老龄化加速）结合使用，避免对单一点预测过度依赖。
