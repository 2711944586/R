        - strong [ref=e4265]: 本节解读
        - paragraph [ref=e4266]: 寿命弹性专题用于解释边际收益递减。低投入区间的资金增量往往直接转化为基本服务可及性和儿童死亡率改善；高投入区间则更多受慢病、老龄化、医疗价格和长期照护影响。
        - paragraph [ref=e4267]: 因此，本节既看均值拟合，也看分位差异。对低收入和中低收入国家，增量资金仍具有较高健康回报；对高收入国家，重点则转向效率、预防和支付制度。
