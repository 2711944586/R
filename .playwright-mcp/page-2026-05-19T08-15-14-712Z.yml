            - paragraph [ref=e1881]: 弹性估计：面板固定效应模型估计为 65+ 占比每上升 1pp，人均 CHE 上升 2.3%（p < 0.001）。OECD 子样本弹性为 +3.8%/pp，远高于 LMIC 子样本的 +1.4%/pp。这种异质性反映了两个事实：(1) 高收入国家的老龄人口占有更多医保资源；(2) LMIC 的供给侧约束（服务可及性不足）押制了需求释放。
            - paragraph [ref=e1882]: 制度调节：各国应对老龄化的制度路径不同。社会医保主导型（德国、日本、韩国）通过调整缴费费率应对压力；财政主导型（英国 NHS、北欧）依赖一般财政补贴；私人保险主导型（美国）则呈现老年人 Medicare 支出快速增长、企业保费同步推高的双重压力。
            - paragraph [ref=e1883]: 直接付费压力：老年人的个人自付（OOP）负担不仅取决于医保覆盖，也取决于退休金充足性。OECD 数据显示，75+ 老年人的医疗 OOP 是 25–64 岁人群的 2.5–3 倍。未来老年人贫困率与医疗财务脆弱性是生活质量的关键决定因素。
