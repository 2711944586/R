        - paragraph [ref=e688]: F3 将 Gini、Theil 和 Lorenz 放在一起，是为了避免单一不平等指标误导。Gini 反映整体分布，Theil 能拆解组间/组内来源，Lorenz 则直观展示人口累计份额与资源累计份额的偏离。
