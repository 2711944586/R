    - generic [ref=e46]:
      - generic [ref=e47]:
        - generic [ref=e48]: S02 · DATA PROCESSING
        - heading "原始数据处理" [level=2] [ref=e49]
        - paragraph [ref=e50]: 所有分析共享同一份 master 宽表；下游模型与图表只读取此缓存，确保结果可复现。
      - paragraph [ref=e51]:
        - text: 本研究的因变量是
        - emphasis [ref=e52]: 每国每年的卫生支出
        - text: ，核心面板包含当年价与 USD 2023 不变价的 CHE、人均 CHE、按筹资来源（政府强制 gghed、私人 pvtd、外援 ext）和筹资方案（hf1–hfnec）的占比，以及来自 World Bank 的人口、GDP/cap、预期寿命与 U5MR。
      - paragraph [ref=e53]:
        - text: 数据来源：
        - link "WHO GHED 2024-12" [ref=e54] [cursor=pointer]:
          - /url: https://apps.who.int/nha/database
        - text: （三张表共 ~280k 行） + WDI（人口、GDP、寿命等 30 个指标）；处理后统一保存在
        - code [ref=e55]: 派生数据/处理结果/master_enriched.rds
        - text: 。
      - paragraph [ref=e56]: 所有金额变量统一采用 USD 2023 不变价（消除汇率与通胀干扰），所有结构变量统一采用 % of CHE。人口加权用于所有跨国聚合统计。
      - figure "01_io.R · 数据读入：解析 GHED 三个数据集" [ref=e57]:
        - generic [ref=e58]: 01_io.R · 数据读入：解析 GHED 三个数据集
        - code [ref=e60]: "# ============================================================================= # 程序/01_io.R # ----------------------------------------------------------------------------- # 原始数据读入：严格不改变指定的三个变量名 financing_schemes / health_spending / # spending_purpose。提供标准化的读取接口、类型修正和基础清洗。 # ============================================================================= if (!exists(\"proj_root\", mode = \"function\")) { source(file.path(\"程序\", \"00_utils.R\")) } # ---- 0. 数据集路径 --------------------------------------------------------- ghs_data_dir <- function() { file.path(proj_root(), \"原始数据\") } ghs_csv_paths <- function() { d <- ghs_data_dir() list( financing_schemes = file.path(d, \"financing_schemes.csv\"), health_spending = file.path(d, \"health_spending.csv\"), spending_purpose = file.path(d, \"spending_purpose.csv\") ) } # ---- 1. 通用读取 ------------------------------------------------------------ #' 读取单个 CSV，统一类型 #' #' @param path 文件路径 #' @return tibble read_ghs_csv <- function(path) { ensure_pkgs(c(\"readr\")) readr::read_csv( path, col_types = readr::cols( country_name = readr::col_character(), iso3_code = readr::col_character(), year = readr::col_integer(), indicator_code = readr::col_character(), value = readr::col_double(), unit = readr::col_character(), .default = readr::col_character() ), progress = FALSE, show_col_types = FALSE ) } # ---- 2. 三数据集入口 -------------------------------------------------------- #' 读取三张原始表；变量名严格保持不改 #' #' @param assign_globals 若为 TRUE，在全局环境也赋值，供作业脚本直接使用 #' @return named list(financing_schemes, health_spending, spending_purpose) load_ghs <- function(assign_globals = FALSE) { paths <- ghs_csv_paths() missing_files <- vapply(paths, function(p) !file.exists(p), logical(1)) if (any(missing_files)) { stop( \"Missing raw CSV(s): \\n \", paste(paths[missing_files], collapse = \"\\n \"), call. = FALSE ) } logi(\"reading 3 raw CSVs from \", ghs_data_dir()) out <- list( financing_schemes = read_ghs_csv(paths$financing_schemes), health_spending = read_ghs_csv(paths$health_spending), spending_purpose = read_ghs_csv(paths$spending_purpose) ) if (isTRUE(assign_globals)) {"
      - paragraph [ref=e61]: 原始三张表：health_spending.csv（卫生支出来源表，含 CHE/GGHED/PVTD/EXT 等大指标）、financing_schemes.csv（HF1–HF4 筹资方案占比）、spending_purpose.csv（HC1–HC9 支出用途占比）。三表以 iso3_code + year 为主键关联，最终合并为宽表。
      - figure "02_clean.R · 清洗与透视：长表 → 宽表" [ref=e62]:
        - generic [ref=e63]: 02_clean.R · 清洗与透视：长表 → 宽表
        - code [ref=e65]: "# ---- 1. long tidy ----------------------------------------------------------- #' 长表：统一列名、加 prefix / unit_type 辅助列 long_tidy <- function(ghs = load_ghs()) { ensure_pkgs(c(\"dplyr\")) bind_one <- function(df, dataset_name, label_col) { df |> dplyr::mutate( dataset = dataset_name, prefix = ghs_indicator_prefix(.data$indicator_code), unit_type = ghs_indicator_unit(.data$indicator_code), label = .data[[label_col]] ) } out <- dplyr::bind_rows( bind_one(ghs$financing_schemes, \"financing_schemes\", \"financing_scheme\"), bind_one(ghs$health_spending, \"health_spending\", \"expenditure_type\"), bind_one(ghs$spending_purpose, \"spending_purpose\", \"spending_purpose\") ) out |> dplyr::mutate( value = dplyr::if_else(.data$value < 0, 0, .data$value) ) |> dplyr::select( dplyr::any_of(c( \"dataset\", \"country_name\", \"iso3_code\", \"year\", \"indicator_code\", \"prefix\", \"unit_type\", \"label\", \"value\", \"unit\" )) ) } # ---- 2. 宽表透视 ------------------------------------------------------------ #' 把一个数据集透视为宽表：每国-每年一行，列名 = indicator_code #' 这样 hf1_che / gghed_usd2023 / hc6_che 等都直接对应原始编码， #' 下游所有函数（plots / models）使用一致的命名。 #' #' @param df long_tidy() 的某一 dataset 子集，或原始 CSV df #' @return 宽 tibble to_wide <- function(df) { ensure_pkgs(c(\"dplyr\", \"tidyr\")) df |> dplyr::select(dplyr::any_of(c( \"country_name\", \"iso3_code\", \"year\", \"indicator_code\", \"value\" ))) |> tidyr::pivot_wider( names_from = \"indicator_code\", values_from = \"value\", values_fn = ~ mean(.x, na.rm = TRUE) ) }"
      - paragraph [ref=e66]: 清洗步骤：(1) 将长格式的筹资/用途数据透视为宽表；(2) 统一列名规范（小写 + 下划线）；(3) 将绞对额从当年美元折算为 USD 2023 不变价；(4) 移除重复行与无效 iso3_code。
      - figure "03_enrich.R · 国家元数据增强（countrycode + WDI）" [ref=e67]:
        - generic [ref=e68]: 03_enrich.R · 国家元数据增强（countrycode + WDI）
        - code [ref=e70]: "enrich_country_meta <- function(iso_vec) { ensure_pkgs(c(\"countrycode\", \"dplyr\", \"tibble\")) iso_vec <- unique(iso_vec) tibble::tibble( iso3_code = iso_vec, country_name_iso = suppressWarnings( countrycode::countrycode(iso_vec, \"iso3c\", \"country.name\") ), continent = suppressWarnings( countrycode::countrycode(iso_vec, \"iso3c\", \"continent\") ), region23 = suppressWarnings( countrycode::countrycode(iso_vec, \"iso3c\", \"region23\") ), un_region = suppressWarnings( countrycode::countrycode(iso_vec, \"iso3c\", \"un.region.name\") ), un_subregion = suppressWarnings( countrycode::countrycode(iso_vec, \"iso3c\", \"un.regionsub.name\") ) ) }"
      - paragraph [ref=e71]: 增强步骤：(1) 通过 countrycode 包添加大洲、区域、收入组；(2) 通过 wbstats 拉取 WDI 人口、GDP/cap、预期寿命、U5MR 等 30 个指标；(3) 世界银行收入组分类作为分组变量入表；(4) 对缺失国家使用 2022 年分类作为 fallback。
      - paragraph [ref=e72]: 对所有用于不平等、聚类与建模的人均 CHE，统一使用 人口加权，避免小国/大国权重失衡。不平等指数使用三种补充方法：Gini（对中间敏感）、Theil-T（对高端敏感，可加性分解）、Atkinson（对低端敏感，参数可调）。
      - figure "04_metrics.R · 不平等指数：加权 Gini / Theil-T / Atkinson" [ref=e73]:
        - generic [ref=e74]: 04_metrics.R · 不平等指数：加权 Gini / Theil-T / Atkinson
        - code [ref=e76]: "#' 加权基尼系数（Dagum 2000 式） gini_weighted <- function(x, w = NULL) { if (is.null(w)) w <- rep(1, length(x)) ok <- is.finite(x) & is.finite(w) & x >= 0 & w > 0 x <- x[ok]; w <- w[ok] if (length(x) < 2) return(NA_real_) ord <- order(x) x <- x[ord]; w <- w[ord] cum_w <- cumsum(w) cum_xw <- cumsum(x * w) total_w <- sum(w); total_xw <- sum(x * w) if (total_xw == 0) return(0) g <- 1 - 2 * sum((cum_xw - x * w / 2) * w) / (total_w * total_xw) g } #' Theil-T 指数（人口加权） theil_t <- function(x, w = NULL) { if (is.null(w)) w <- rep(1, length(x)) ok <- is.finite(x) & is.finite(w) & x > 0 & w > 0 x <- x[ok]; w <- w[ok] if (length(x) < 2) return(NA_real_) mean_x <- stats::weighted.mean(x, w) if (mean_x == 0) return(0) sum(w * x / sum(w * x) * log(x / mean_x)) } #' Atkinson 指数 (ε) atkinson <- function(x, w = NULL, eps = 0.5) { if (is.null(w)) w <- rep(1, length(x)) ok <- is.finite(x) & is.finite(w) & x > 0 & w > 0 x <- x[ok]; w <- w[ok] if (length(x) < 2) return(NA_real_) mean_x <- stats::weighted.mean(x, w) if (eps == 1) { ede <- exp(stats::weighted.mean(log(x), w)) } else { ede <- (stats::weighted.mean(x^(1 - eps), w))^(1 / (1 - eps)) } 1 - ede / mean_x }"
      - paragraph [ref=e77]:
        - text: 模型层面：(1) β-收敛回归检验“贫国追赶”假说；(2) 双向固定效应面板估计 GDP ↔ CHE 弹性；(3) PCA + k-means 提取国家筹资 archetype；(4) ARIMA/ETS 预测未来 5 年趋势。所有模型输出存储在
        - code [ref=e78]: 分析输出/模型表/
        - text: 。
      - paragraph [ref=e79]: 可视化层面：共用 theme_ghs() 统一主题、palette_ghs() 语义色板、400 DPI / 12 inch 导出规格。交互组件统一使用 ghs_plotly_layout() 应用品牌字体、背景与布局。
