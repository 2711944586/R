            - paragraph [ref=e1972]: 城镇化现状：2000–2023 间全球城镇化率从 46.7% 上升至 56.9%，但存在显著分化：HIC 平均 81%，LMIC 为 50%，LIC 仅 33%。中国、印度、印尼等亚洲主要经济体过去二十年城镇化率提高 15–20pp，外在表现为近 7 亿人从乡村迁徙至城市。
            - paragraph [ref=e1973]: 传导机制：城镇化递增人均 CHE 的三个主要路径：(1) 服务可及性——城市医院密度高、专科服务集中，医疗需求被“可发现”且实际使用；(2) 需求结构——城市生活方式下 NCD 负担 高（久坐、高热量饮食、空气污染），糖尿病、心血管疑病率高于乡村；(3) 价格上漲——城市医保价格高于乡村基础设施。
            - paragraph [ref=e1974]: 偏相关结果：控制 GDP 后，urban_pop 与 ln(CHE_pc) 的偏相关为 +0.34（p < 0.001）。仅 LMIC 子样本偏相关上升至 +0.46，表明城镇化在中低收入环境对 CHE 的边际推动作用更强。仅 OECD 子样本偏相关仅 +0.12，表明高收入国家已实现高城镇化状态下的服务饮和。
            - paragraph [ref=e1975]: 并发风险：快速城镇化可能创造“需求冲击”：护士密度、初级医疗覆盖不足时，城市人口会倒灯隐胶医院门诊、推高不合理高费。需同时加强社区医疗准备，避免在需求脱带上升后不可避免的“医保价格”问题。
