            - paragraph [ref=e3610]: 三轴综合：充足性 (CHE_pc 标准化) + 公平性 (1-OOP_share) + 效率 (DEA score)。PCA 确定权重后加权平均。北欧国家在三个维度均表现优异。
            - paragraph [ref=e3611]: 等权与 PCA 权重排名相关 0.92，表明结果对权重选择较稳健。但去掉任一轴 Top10 变动 30%，说明单一维度可能给出误导性结论。
        - complementary [ref=e3612]:
          - strong [ref=e3613]: 证据链补充解读
