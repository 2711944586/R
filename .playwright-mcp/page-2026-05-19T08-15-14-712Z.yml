        - paragraph [ref=e1057]: 因此，F7 的价值在于比较同类国家，而不是把所有国家放在一个排行榜里。对外援依赖型国家，关键是过渡融资；对高自付型国家，关键是预付费和风险池扩大。
      - generic [ref=e1058]:
        - generic [ref=e1059]:
          - paragraph [ref=e1060]: 研究问题：把国家放在筹资结构空间（GGHED · PVTD · EXT · OOPS），它们能聚成几个 archetype？
          - paragraph [ref=e1061]: 方法：对最近一年的截面做 PCA（中心化 + 标准化），保留前两主成分，再用 k-means(k=4, nstart=25) 聚类。
        - figure "05_models.R · PCA + k-means" [ref=e1062]:
          - generic [ref=e1063]: 05_models.R · PCA + k-means
          - code [ref=e1065]: "fit_pca <- function(df, vars, scale = TRUE) { ensure_pkgs(c(\"dplyr\")) keep <- df |> dplyr::select(dplyr::all_of(c(\"iso3_code\", \"country_name\", vars))) |> tidyr::drop_na() if (nrow(keep) < 5) { warning(\"PCA: fewer than 5 complete observations; returning NULL\") return(NULL) } X <- as.matrix(keep[, vars, drop = FALSE]) rownames(X) <- keep$iso3_code pca <- stats::prcomp(X, center = TRUE, scale. = scale) list( pca = pca, scores = as.data.frame(pca$x) |> tibble::rownames_to_column(\"iso3_code\") |> dplyr::left_join(keep[, c(\"iso3_code\", \"country_name\")], by = \"iso3_code\"), loadings = as.data.frame(pca$rotation) |> tibble::rownames_to_column(\"variable\"), var_explained = summary(pca)$importance[\"Proportion of Variance\", ] ) } # ---- 2. k-means 聚类 -------------------------------------------------------- #' 在 PCA 前两主成分上做 k-means fit_cluster <- function(pca_obj, k = 4, seed = 1L) { if (is.null(pca_obj)) return(NULL) set.seed(seed) X <- pca_obj$scores[, grep(\"^PC\", names(pca_obj$scores))] if (ncol(X) < 2) { warning(\"cluster: need at least 2 PCs\") return(NULL) } km <- stats::kmeans(X[, 1:min(ncol(X), 5)], centers = k, nstart = 25) scores <- pca_obj$scores scores$cluster <- factor(km$cluster) list(km = km, scores = scores, k = k) }"
