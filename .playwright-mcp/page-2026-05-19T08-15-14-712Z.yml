        - complementary [ref=e651]:
          - strong [ref=e652]: 解读 · OOPS 与筹资结构分析
          - generic [ref=e653]:
            - paragraph [ref=e654]: OOPS 概念：OOPS（Out-of-pocket spending as share of CHE）即居民自付占卫生总费用的比例，是 WHO/世界银行推荐的筹资保护核心指标。当 OOPS 超过 15–20% 时，家庭发生“灾难性卫生支出”的风险显著上升，即居民因看病而致贫的可能性大大增加。2023 年全球平均 OOPS 约为 30.3%，但国家间差异巨大，从不足 5% 到超过 80%。
            - paragraph [ref=e655]: 地理模式：从地图与大洲箱线图可见，OOPS 呈现显著的地理聚集：南亚（印度、孟加拉、尼泊尔）与中亜广泛超过 60%，撒哈拉以南非洲多国在 30–50% 间，而西欧、北欧、大洋洲普遍低于 15%。这与全民健康覆盖（UHC）的实现程度高度一致——几乎所有 OOPS > 50% 的国家其 UHC 有效覆盖指数均低于 50。
            - paragraph [ref=e656]: 收入组别差异：山脊图清晰展示了不同收入组别 OOPS 分布的形态差异。高收入国家（HIC）分布左偶、极为集中，中位数约 12%；低收入国家（LIC）则右偶并展开，中位数超过 40%，且尾部延伸至 80% 以上。2023 年仍有 32 个国家 OOPS 高于 50%，这些国家几乎全部属于 LIC 或 LMIC，形成明显的“筹资陷阱”。
            - paragraph [ref=e657]: 政策含义：降低 OOPS 的关键在于提升强制性筹资（GGHED + SHI）占比。经验表明，当 GGHED 占 CHE 超过 40%% 时，OOPS 通常可控制在 30%% 以下。外援（EXT）可提供短期补充，但不可持续；SDG 3.8 要求各国构建国内筹资机制以实现财务保护。对于 OOPS > 50%% 的国家，优先推荐扩大社会医疗保险覆盖、加强财政空间开发，以及针对贫困人口的定向补贴政策。
