        - complementary [ref=e1506]:
          - strong [ref=e1507]: 解读 · 资金不等于成效
          - generic [ref=e1508]:
            - paragraph [ref=e1509]: 估计关系：人均 CHE 翻倍 ≈ 增加 4-5 年预期寿命，但跨资金区间呈现边际递减。在 CHE/cap < 500 USD 区间，边际产出最高；超过 5000 USD 后每翻倍仅带来不到 1 年寿命提升。
            - paragraph [ref=e1510]: 高效率领先者：古巴、越南、泰国、斯里兰卡和部分加勒比小国呈现“低投入高产出”特征。这些国家的共同特征是强大的基层卫生服务体系和较高的社会医保覆盖率。
            - paragraph [ref=e1511]: 低效率异常点：部分中东、中亚和拉丁美洲国家人均 CHE 较高，但预期寿命低于模型预测值。美国是最显著的异常点：CHE/cap 全球最高但预期寿命仅约 77 岁。
            - paragraph [ref=e1512]: 含义：资金不是寿命的同义词，体系质量、社保和公卫能力仍主导效率。对于高投入低产出国家，优化资源配置（从 hc1 转向 hc6）比增加总量更为重要。
