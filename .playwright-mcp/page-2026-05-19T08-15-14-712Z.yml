        - complementary [ref=e791]:
          - strong [ref=e792]: 解读 · 平均上升 / 不平等下降的悶论
          - generic [ref=e793]:
            - paragraph [ref=e794]: 结构性下降：人口加权 Gini 由 2000 年的约 0.811 降至 2023 年的约 0.772；并非来自富国停滞，而是中、印、印尼等大国人均 CHE 快速上升。这种下降主要由发展中国家向上攻击驱动，而非高收入国家的下滑。
            - paragraph [ref=e795]: 剩余不平等仍极高：0.77 的 Gini 仍处于全球收入分配的极端区间。跨国人均 CHE 的 P90/P10 比值仍可达 50 倍以上，表明不同发展水平的国家在卫生资源可及性上存在巨大鸿沟。
            - paragraph [ref=e796]: 三指标互补：Atkinson(ε=1) 长期高于 0.69，提示底层敏感的不平等下降幅度更小。Theil 对高端敏感，其下降幅度更大，说明高收入国家之间的集中度有所缓解。
            - paragraph [ref=e797]: 政策含义：尽管跨国不平等整体在改善，但改善速度缓慢，若按当前趋势需 30+ 年才能显著缩小差距。对于底部国家，仅依靠经济增长不足以弥合差距，需要国际社会定向的卫生筹资支持和制度能力建设。
