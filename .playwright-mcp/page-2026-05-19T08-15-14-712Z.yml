        - generic [ref=e37]: TLDR · 核心发现
        - list [ref=e38]:
          - listitem [ref=e39]: 总量上集中在高收入国家：全球 2023 年 CHE 达 $10.56T，但人均 P90/P10 差异高达 80.4x。
          - listitem [ref=e40]: 财务保护仍不充分：32 个国家居民自付占 CHE 超 50%； OOPS 与 GGHED 高度负相关（F2）。
          - listitem [ref=e41]: 不平等下降但绝对水平仍高：人口加权 Gini 由 0.81 降至 0.77，但 0.77 在跨国收入分配中处于极端区间（F3）。
          - listitem [ref=e42]: COVID-19 冲击下两类轨迹：多数 OECD CHE 抬升 + OOPS 下降；部分中低收入国家 CHE 抬升但 OOPS 同步上升（F4）。
          - listitem [ref=e43]: 追赶不是自动的：β-收敛成立但半收敛年跨大洲差异显著；双向 FE 弹性约 0.8 < 1，仅靠 GDP 增长不足以驱动 UHC（F5、F6）。
