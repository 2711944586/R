        - figure "05_models.R · ARIMA 预测" [ref=e1117]:
          - generic [ref=e1118]: 05_models.R · ARIMA 预测
          - code [ref=e1120]: "#' 用 fable 或 forecast 对一国一指标做 h 期预测 fit_forecast <- function(ts_vec, years, h = 5, method = c(\"auto\", \"prophet\")) { method <- match.arg(method) ts_vec <- as.numeric(ts_vec) ok <- is.finite(ts_vec) if (sum(ok) < 5) return(NULL) ts_vec <- ts_vec[ok]; years <- years[ok] if (method == \"auto\" && requireNamespace(\"forecast\", quietly = TRUE)) { ts_obj <- stats::ts(ts_vec, start = min(years), frequency = 1) fit <- tryCatch(forecast::auto.arima(ts_obj), error = function(e) NULL) if (is.null(fit)) return(NULL) fc <- forecast::forecast(fit, h = h) return(tibble::tibble( year = (max(years) + 1):(max(years) + h), point = as.numeric(fc$mean), lo_80 = as.numeric(fc$lower[, 1]), hi_80 = as.numeric(fc$upper[, 1]), lo_95 = as.numeric(fc$lower[, 2]), hi_95 = as.numeric(fc$upper[, 2]), method = \"ARIMA\" )) } if (method == \"prophet\" && requireNamespace(\"prophet\", quietly = TRUE)) { dfp <- data.frame( ds = as.Date(paste0(years, \"-01-01\")), y = ts_vec ) m <- tryCatch( prophet::prophet(dfp, yearly.seasonality = FALSE, weekly.seasonality = FALSE, daily.seasonality = FALSE, verbose = FALSE), error = function(e) NULL ) if (is.null(m)) return(NULL) future <- prophet::make_future_dataframe(m, periods = h, freq = \"year\") pred <- stats::predict(m, future) tail_n <- utils::tail(pred, h) return(tibble::tibble( year = as.integer(format(tail_n$ds, \"%Y\")), point = tail_n$yhat, lo_80 = tail_n$yhat_lower, hi_80 = tail_n$yhat_upper, lo_95 = tail_n$yhat_lower, hi_95 = tail_n$yhat_upper, method = \"Prophet\" )) } NULL }"
