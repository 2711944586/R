          - generic [ref=e1076]:
            - paragraph [ref=e1077]: A · 政府强主导：欧洲 + 部分东亚高收入国家，GGHED > 70%。这类国家通过强制性社会保险或税收筹资实现了广泛的财务保护，OOPS 长期维持在 15% 以下。
            - paragraph [ref=e1078]: B · 私人保险型：美国为典型；PVTD 与 OOPS 均高。尽管人均 CHE 全球最高，但由于古全性较低，卫生结果（预期寿命、U5MR）并未比肩 A 类国家。
            - paragraph [ref=e1079]: C · 自付驱动型：南亚、中亚国家；OOPS > 40%，财务保护薄弱。居民在就医时承受巨大财务压力，灭贫效果明显抑制了卫生服务利用率。
            - paragraph [ref=e1080]: D · 外援依赖型：撒哈以南非洲低收入国家；EXT 占比显著。这类国家面临“援助退出后空白”的风险，需要在援助窗口期内建立本土筹资能力。
