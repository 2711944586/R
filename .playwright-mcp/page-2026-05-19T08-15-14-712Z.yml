            - paragraph [ref=e2157]: 家庭动态：世界银行 LSMS 调查数据表明，在 OOP_pc/HFC_pc > 5% 的环境下，家庭遇到医疗事件时选择延缓就诊或不就诊的概率高达 35%，默警代护者能赵象 明反入 占事。这产生了根本性 不能付 “隐肱需求”，不仅增加个人長期医疗负担，还化 如及肉金护不預微 起起。
            - paragraph [ref=e2158]: 衡量改革：SDG 3.8.2 “灾难性健康支出发生率”使用 “OOP > 10% 家庭消费” 作为阈值，这比仅看 OOP/CHE 更接近实际可负担性。建议各国在衡量财务保护时同时报告 OOP/CHE 与 OOP/HFC 两个指标，并在家庭调查中加强定锐医疗费用模块。
