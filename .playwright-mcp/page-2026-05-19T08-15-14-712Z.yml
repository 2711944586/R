        - strong [ref=e3585]: 证据解读
        - paragraph [ref=e3586]: 综合指数 finding 把充足性、公平性和效率放在同一框架中，避免单一指标过度主导。高 CHE/cap 但 OOPS 高或效率低的国家，不应被简单评为优秀。
        - paragraph [ref=e3587]: 综合排名的价值是暴露权衡：北欧国家通常三轴均衡，而一些高支出国家在效率或公平上被扣分。任何单国解读都应回到三轴分项，而不是只看总分。
