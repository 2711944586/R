        - complementary [ref=e1379]:
          - strong [ref=e1380]: 解读 · 外援仅能托底
          - generic [ref=e1381]:
            - paragraph [ref=e1382]: 集中于低收入：2023 年仍有 36 个国家 EXT > 20%，全部为 LIC/LMIC。这些国家的卫生系统在结构上依赖外部资金，一旦援助退出将面临体系崩溃风险。
            - paragraph [ref=e1383]: 与 OOPS 并存：高 EXT 国家多数 OOPS 同样偏高，意味着外部输血未能有效减轻居民财务负担。援助资金多流向医院基建和纵向项目，而非抬升居民财务保护水平。
            - paragraph [ref=e1384]: 成功退出案例：越南、博茨瓦纳 EXT 由 2005 年 >15% 降至 2023 年 <5%，同时 GGHED 与 PVTD 填补了缺口，实现了“援助毕业”。
            - paragraph [ref=e1385]: 路径：需同步推动本土财政强制汇集、社会医疗保险扩面、PHC 初诊补偿。援助方应将“本土筹资能力”作为援助退出的关键指标纳入监测。
