          - code [ref=e438]: "# ============================================================================= # 程序/07_plot_static.R # ----------------------------------------------------------------------------- # 静态图工厂函数：输入 tidy tibble，输出 ggplot 对象。 # 所有函数签名：plot_*(data, ..., title, subtitle, caption) # ============================================================================= if (!exists(\"proj_root\", mode = \"function\")) { source(file.path(\"程序\", \"00_utils.R\")) source(file.path(\"程序\", \"06_plot_theme.R\")) } # ============================================================================= # A. 趋势 / 时序 # ============================================================================= #' 全球三源（政府/私人/外援）占比时序堆叠面积 #' #' @param master 宽表 (含 gghed_che, pvtd_che, ext_che, year, pop) plot_source_area <- function(master, title = \"全球卫生支出来源结构演化 Global Health Financing Sources\", subtitle = NULL) { ensure_pkgs(c(\"dplyr\", \"tidyr\", \"ggplot2\", \"scales\")) has_pop <- \"pop\" %in% names(master) && any(is.finite(master$pop)) safe_wmean <- function(x, w) { ok <- is.finite(x) & is.finite(w) & w > 0 if (!any(ok)) return(mean(x, na.rm = TRUE)) stats::weighted.mean(x[ok], w[ok], na.rm = TRUE) } if (is.null(subtitle)) { subtitle <- if (has_pop) { \"2000–2023 · 按人口加权均值，占总开支 % of CHE\" } else { \"2000–2023 · 未加权均值，占总开支 % of CHE\" } } d <- master |> dplyr::group_by(.data$year) |> dplyr::summarise( gghed = if (has_pop) { safe_wmean(.data$gghed_che, .data$pop) } else mean(.data$gghed_che, na.rm = TRUE), pvtd = if (has_pop) { safe_wmean(.data$pvtd_che, .data$pop) } else mean(.data$pvtd_che, na.rm = TRUE), ext = if (has_pop) { safe_wmean(.data$ext_che, .data$pop) } else mean(.data$ext_che, na.rm = TRUE), .groups = \"drop\" ) |> tidyr::pivot_longer(c(\"gghed\", \"pvtd\", \"ext\"), names_to = \"source\", values_to = \"pct\") |> dplyr::mutate(source = factor(.data$source, levels = c(\"gghed\", \"pvtd\", \"ext\"))) ggplot2::ggplot(d, ggplot2::aes(.data$year, .data$pct, fill = .data$source)) + ggplot2::geom_area(alpha = 0.9, position = \"stack\") + scale_fill_ghs_source( labels = c(gghed = \"政府 GGHE-D\", pvtd = \"私人 PVT-D\", ext = \"外援 EXT\") ) + ggplot2::scale_y_continuous(labels = scales::label_percent(scale = 1)) + labs_ghs("
