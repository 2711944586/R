            - paragraph [ref=e3615]: 综合指数把充足性、公平性和效率合并，是为了避免用单一指标评价系统。CHE/cap 高但 OOPS 高，说明资金充足却保护不足；OOPS 低但结果差，则说明公平和效率之间仍有缺口。
            - paragraph [ref=e3616]: F36 的价值不是给国家贴最终名次，而是帮助定位短板。政策使用时应回到三轴分项，判断一个国家需要补资金、降自付，还是提高资金产出效率。
